name: ratel_cli
description: >-
  The ratel command line tool: scaffolds, runs, tests and compiles Ratel
  applications. Install it once with dart pub global activate ratel_cli.
version: 2.0.0-dev.8
repository: https://github.com/Ratel-Dart/Ratel
issue_tracker: https://github.com/Ratel-Dart/Ratel/issues
homepage: https://github.com/Ratel-Dart/Ratel
topics:
  - cli
  - backend
  - framework

resolution: workspace

environment:
  sdk: ^3.6.0

executables:
  ratel:

dependencies:
  analyzer: ">=14.4.0 <15.0.0"
  path: ^1.9.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
