name: ratel_generator
description: >-
  build_runner code generator for the Ratel framework: replaces the runtime
  dart:mirrors reflection with generated JSON serialization and controller
  route tables.
version: 0.1.0-dev.1
repository: https://github.com/Ratel-Dart/ratel_generator
resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  path: ^1.9.0
  analyzer: ^14.0.0
  build: ^4.0.0
  source_gen: ^4.0.0

dev_dependencies:
  build_runner: ^2.16.0
  build_test: ^3.5.0
  lints: ^4.0.0
  package_config: ^2.1.0
  test: ^1.25.0
