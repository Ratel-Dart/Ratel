name: ratel_orm
description: >-
  Standalone SQL toolkit for Dart: a driver contract with Postgres and SQLite
  drivers, repositories with explicit row mapping, a query builder and
  migrations. Works with or without the Ratel framework.
version: 0.1.0-dev.1
repository: https://github.com/Ratel-Dart/Ratel
issue_tracker: https://github.com/Ratel-Dart/Ratel/issues
homepage: https://github.com/Ratel-Dart/Ratel
topics:
  - database
  - orm
  - sql
  - backend

resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  postgres: ^3.5.0
  sqlite3: ^2.4.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
