name: ratel
description: >-
  Ratel is a lightweight, annotation-driven backend framework for Dart with HTTP
  routing, dependency injection, middleware and JWT authentication.
version: 2.0.0-dev.8
repository: https://github.com/Ratel-Dart/Ratel
issue_tracker: https://github.com/Ratel-Dart/Ratel/issues
homepage: https://github.com/Ratel-Dart/Ratel
topics:
  - backend
  - http
  - framework
  - rest

resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  dart_jsonwebtoken: ^3.1.1
  logging: ^1.3.0
  mime: ^2.0.0
  path: ^1.9.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
