name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2

      - name: Install workspace dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Test the hygiene checker
        run: dart test
        working-directory: tool/hygiene

      - name: Check hygiene
        run: dart run tool/hygiene/bin/check.dart .

      - name: Test ratel
        run: dart test
        working-directory: packages/ratel

      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Test ratel_cli
        run: dart test
        working-directory: packages/ratel_cli

      - name: Check hygiene of an ORM app build
        run: |
          app="$RUNNER_TEMP/orm_app"
          cp -r packages/ratel_cli/test/fixtures/orm_app "$app"
          printf '\ndependency_overrides:\n  ratel:\n    path: %s\n' "$GITHUB_WORKSPACE/packages/ratel" >> "$app/pubspec.yaml"
          dart compile exe packages/ratel_cli/bin/ratel.dart -o "$RUNNER_TEMP/ratel"
          (cd "$app" && "$RUNNER_TEMP/ratel" build)
          test -f "$app/.dart_tool/ratel/build/server.dart"
          test -f "$app/.dart_tool/ratel/build/ratel_app_manifest.dart"
          test -f "$app/.dart_tool/ratel/build/ratel_entity_manifest.dart"
          dart run tool/hygiene/bin/check.dart "$app/.dart_tool/ratel"

      - name: Compile a native binary (AOT guard)
        run: dart run ../ratel_cli/bin/ratel.dart build example/main.dart
        working-directory: packages/ratel

      - name: Check hygiene of the generated code
        run: dart run tool/hygiene/bin/check.dart packages/ratel/.dart_tool/ratel

      - name: Check hygiene of a scaffolded app
        run: |
          dart run packages/ratel_cli/bin/ratel.dart create "$RUNNER_TEMP/hygiene_app"
          dart run tool/hygiene/bin/check.dart "$RUNNER_TEMP/hygiene_app"

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2

      - name: Install workspace dependencies
        run: dart pub get

      - name: Test ratel
        run: dart test
        working-directory: packages/ratel

      - name: Test ratel_cli
        run: dart test -x orm
        working-directory: packages/ratel_cli

      - name: Compile a native binary (AOT guard)
        run: dart run ../ratel_cli/bin/ratel.dart build example/main.dart
        working-directory: packages/ratel
