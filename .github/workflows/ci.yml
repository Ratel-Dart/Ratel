name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ratel
          POSTGRES_PASSWORD: ratel
          POSTGRES_DB: ratel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2

      - name: Install workspace dependencies
        run: dart pub get

      - name: Generate code for ratel
        run: dart run build_runner build
        working-directory: packages/ratel


      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Test ratel
        run: dart test
        working-directory: packages/ratel

      - name: Test ratel_orm
        run: dart test
        working-directory: packages/ratel_orm
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: ratel_test
          DB_USER: ratel
          DB_PASSWORD: ratel
          DB_SSL_MODE: disable

      - name: Test ratel_generator
        run: dart test
        working-directory: packages/ratel_generator

      - name: Compile a native binary (AOT guard)
        run: dart run bin/ratel.dart build example/main.dart
        working-directory: packages/ratel
