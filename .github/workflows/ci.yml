name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      # Non-fatal for now: flip to a hard gate after the first repo-wide
      # `dart format .` pass once a local SDK is available.
      - name: Verify formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: dart test

      # Validates the package is publishable (metadata, structure). Warnings are
      # expected on a pre-release; kept non-fatal until 2.0.0 is cut.
      - name: Publish dry-run
        continue-on-error: true
        run: dart pub publish --dry-run
